order: 2
years: "2001–2008"
heading: '"We See Mountains Moving"'
body: >-
  MMI grows into a community of partnerships spanning individuals,
  congregations, and mission fields. The Spiritual Gifts Inventory helps
  thousands discover where God has gifted them, and international work takes
  root across Central Asia, India, Kenya, Nepal, the Middle East, Ukraine,
  Zimbabwe, and Latin America.
