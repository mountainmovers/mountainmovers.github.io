title: Mountain Movers International
description: Mountain Movers International serves as a bridge between needs and resources.
heading: Serving as a bridge between needs and resources
intro: >-
  Mountain Movers International helps individuals discern what calling God has
  uniquely equipped them to do — and partners with them to excel in that
  calling.
sections:
  - heading: Our Mission
    quote: >-
      Defend the weak and the fatherless; uphold the cause of the poor and
      oppressed, to rescue the weak and the needy; deliver them from the hand
      of the wicked.
    attribution: Psalm 82:3-4
    body:
      - >-
        Over the years, this has manifested itself in many different programs
        and locales including rescuing victims of sex trafficking, running
        orphanages and schools, drilling water wells, managing farms,
        micro-lending for economic development, establishing clinics and
        hospitals, and much more. We have demonstrated a penchant for
        spearheading attacks on the worst societal issues in the most hopeless
        situations. However, we need your help to continue to support and grow
        these endeavors.
  - heading: Discover Your Spiritual Gifts
    body:
      - >-
        Where has God gifted you? Take our Spiritual Gifts Inventory — 110
        short statements, about 15 minutes — and discover your strengths
        across 22 areas of ministry.
  - heading: Join us
    body:
      - >-
        Stay connected, hear our latest progress reports, and find out about
        the most urgent needs.
  - heading: Make a donation
    quote: >-
      ... if I have a faith that can move mountains, but do not have love, I
      am nothing.
    attribution: 1 Corinthians 13:2
    body: []
