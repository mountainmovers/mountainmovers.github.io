title: About Us
description: >-
  Mountain Movers International was founded in 2000 as a 501(c)(3) non-profit
  serving as a bridge between needs and resources around the world.
heading: About Mountain Movers
intro: >-
  Founded in 2000, Mountain Movers International is a 501(c)(3) non-profit
  organization that serves as a bridge between needs and resources through a
  community of partnerships.
sections:
  - heading: What we believe
    body:
      - >-
        Mountain Movers helps individuals to discern what calling God has
        uniquely equipped them to do and partners with them to excel in that
        calling. We believe every believer has been given gifts, passions, and
        resources meant to be put to work for God — and that the church moves
        mountains when they are.
  - heading: How we work
    body:
      - >-
        MMI serves as a bridge between needs and resources. We identify
        faithful workers already serving in hard places, connect them with the
        prayer, funding, and expertise they need, and stay alongside them for
        the long haul. Our work has spanned discipleship, domestic ministry
        partnerships, and international fields across Asia, Africa, the Middle
        East, and the Americas.
